name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # The interface toolkit sends build-time usage data to its vendor unless this is set. A product
  # that promises to upload nothing should not have its own build reporting to a third party.
  AVALONIA_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  CI: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The same suite runs on both supported platforms, because equivalent results across them
        # is an acceptance criterion rather than an assumption.
        os: [ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore IdentityPostureAssessor.slnx

      - name: Build
        run: dotnet build IdentityPostureAssessor.slnx --configuration Release --no-restore

      - name: Install the browser used for report rendering
        shell: bash
        run: |
          # The rendering tests fail rather than skip when the browser is missing, so a failed
          # install here cannot pass as a green build with no rendering coverage.
          #
          # Deliberately installed without --with-deps: that switch runs apt against every
          # repository configured on the runner image, including a third-party one that has
          # returned a hash mismatch and failed the whole job. The image already carries the
          # libraries a headless browser needs, so the dependency step buys nothing and costs
          # a dependency on somebody else's package index.
          pwsh tests/Ipa.Reporting.Tests/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Test
        run: >
          dotnet test IdentityPostureAssessor.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results-${{ matrix.os }}.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results

      - name: Confirm the rule catalogue is current
        shell: bash
        run: |
          # The catalogue is generated from the pack, so a stale document fails the build.
          git diff --exit-code docs/rules.md

  sample-report:
    name: Render a sample report
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build IdentityPostureAssessor.slnx --configuration Release

      - name: Install the browser
        # Without --with-deps, for the reason given in the build job.
        run: pwsh tests/Ipa.Reporting.Tests/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Render
        env:
          # Absolute on purpose. A test process runs from its own output directory, so a relative
          # path here wrote the sample into bin/ and left the uploaded artifact empty.
          IPA_SAMPLE_REPORT_DIR: ${{ github.workspace }}/artifacts/sample-report
        run: >
          dotnet test tests/Ipa.Reporting.Tests --configuration Release --no-build
          --filter SampleReportIsWrittenWhenRequested

      - name: Confirm the sample was produced
        shell: bash
        run: |
          # The render step is filtered down to a single test, so an empty result would otherwise
          # be indistinguishable from a successful run.
          test -s artifacts/sample-report/sample-report.pdf
          test -s artifacts/sample-report/sample-report.html

      - name: Upload the sample for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: artifacts/sample-report
